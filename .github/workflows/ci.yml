name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/app backend/eval

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  eval:
    runs-on: ubuntu-latest
    # Answer-quality regression gate: runs the RAG pipeline over the golden
    # dataset and FAILS the build if mean faithfulness drops below the threshold.
    # Requires the GOOGLE_API_KEY secret (Gemini Developer API) to call the LLM.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sourcebound
          POSTGRES_PASSWORD: sourcebound
          POSTGRES_DB: sourcebound
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sourcebound"
          --health-interval 10s --health-timeout 5s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+asyncpg://sourcebound:sourcebound@localhost:5432/sourcebound
      QDRANT_URL: http://localhost:6333
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-2.5-flash
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Lightweight reranker so CI doesn't download the ~1GB BGE model.
      SOURCEBOUND_RERANKER_MODEL: Xenova/ms-marco-MiniLM-L-6-v2
      # Configure the gate via a repository variable; defaults to 0.8.
      FAITHFULNESS_THRESHOLD: ${{ vars.FAITHFULNESS_THRESHOLD || '0.8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Wait for Qdrant
        run: until curl -sf localhost:6333/readyz; do sleep 1; done
      - name: Apply DB migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Run eval harness (faithfulness gate)
        run: python eval/run_eval.py --min-faithfulness "$FAITHFULNESS_THRESHOLD"
        working-directory: backend
