name: CI

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes to the same branch/PR cancel in-flight runs — saves minutes and
# gives faster feedback on the latest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Stage 1: static checks + tests (run in parallel) ------------------------
  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check backend/app backend/eval

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm                       # cache ~/.npm keyed on the lockfile
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    # Full pytest suite: fast mocked unit tests + integration tests that spin
    # throwaway Postgres + Qdrant via testcontainers (Docker is preinstalled on
    # ubuntu-latest, so no `services:` block is needed — each test owns its DB).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip                       # cache the pip download cache
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - name: Run pytest
        run: pytest
        working-directory: backend

  # --- Stage 1 (cont.): answer-quality regression gate (independent) -----------
  eval:
    runs-on: ubuntu-latest
    # Runs the corrective-RAG pipeline over the golden dataset and FAILS the build
    # if mean faithfulness drops below the threshold. Needs the GOOGLE_API_KEY
    # secret (Gemini Developer API) — skipped on fork PRs where it isn't available.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sourcebound
          POSTGRES_PASSWORD: sourcebound
          POSTGRES_DB: sourcebound
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sourcebound"
          --health-interval 10s --health-timeout 5s --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+asyncpg://sourcebound:sourcebound@localhost:5432/sourcebound
      QDRANT_URL: http://localhost:6333
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-2.5-flash
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      # Lightweight reranker so CI doesn't download the ~1GB BGE model.
      SOURCEBOUND_RERANKER_MODEL: Xenova/ms-marco-MiniLM-L-6-v2
      # Gate threshold is configurable via the FAITHFULNESS_THRESHOLD repo variable
      # (Settings → Secrets and variables → Actions → Variables); defaults to 0.8.
      FAITHFULNESS_THRESHOLD: ${{ vars.FAITHFULNESS_THRESHOLD || '0.8' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Wait for Qdrant
        run: until curl -sf localhost:6333/readyz; do sleep 1; done
      - name: Apply DB migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Run eval harness (faithfulness gate)
        run: python eval/run_eval.py --min-faithfulness "$FAITHFULNESS_THRESHOLD"
        working-directory: backend

  # --- Stage 2: build the production Docker images -----------------------------
  build-images:
    runs-on: ubuntu-latest
    # Only build once code passes lint + tests — don't waste minutes on a red PR.
    needs: [lint-backend, lint-frontend, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (api / worker / migrate)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false                      # PR build is a validation, not a publish
          tags: sourcebound/api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image (Next.js standalone)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: sourcebound/frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
            NEXT_PUBLIC_ENV=production
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
