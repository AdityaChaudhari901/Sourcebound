# Render Blueprint for the Sourcebound demo API (free tier, Vertex via GCP credits).
#
# Use it: Render → New → Blueprint → pick this repo. It pre-creates the web service
# with the right build/runtime/health settings and lists the env vars. You then:
#   1. fill the secret values (the `sync: false` ones below) in the dashboard, and
#   2. add a Secret File named `gcp-sa.json` (paste your service-account JSON) —
#      Blueprints can't define secret files, so this one step is manual. It mounts
#      at /etc/secrets/gcp-sa.json, which GOOGLE_APPLICATION_CREDENTIALS points to.
#
# Prefer free Gemini API + local BGE instead of Vertex? Swap the LLM_PROVIDER/
# LLM_MODEL/EMBEDDING lines per docs/deploy.md and add GOOGLE_API_KEY (sync:false).
services:
  - type: web
    name: sourcebound-api
    runtime: docker
    plan: free
    region: virginia            # match Neon + Qdrant (us-east-1) for low latency
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Free tier has no separate pre-deploy step, so migrate at startup via
    # start.sh (alembic upgrade head, then uvicorn). A script avoids shell-quoting
    # issues with an inline command.
    dockerCommand: sh start.sh
    envVars:
      # --- non-secret config (committed) ---
      - key: SOURCEBOUND_ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: vertex
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: VERTEX_REGION
        value: global
      - key: SOURCEBOUND_EMBEDDING_PROVIDER
        value: vertex
      # Cross-encoder rerank: ~160 MB ONNX model at query time -> ~380 MB of 512 MB.
      # Enabled per request; tight on the free instance — if queries OOM (502), set
      # back to "false" or move to a larger (1 GB) instance.
      - key: SOURCEBOUND_RERANK_ENABLED
        value: "true"
      # Hybrid = dense (Vertex) + BM25 sparse for lexical recall. BM25 adds only
      # ~6 MB, so it fits 512 MB fine.
      - key: SOURCEBOUND_RETRIEVER_MODE
        value: hybrid
      - key: SOURCEBOUND_RERANKER_MODEL
        value: Xenova/ms-marco-MiniLM-L-6-v2     # used only when rerank is enabled
      # Web-search fallback (Tavily) when local retrieval is weak; TAVILY_API_KEY is
      # a secret set in the dashboard.
      - key: WEB_SEARCH_ENABLED
        value: "true"
      # Langfuse per-node tracing; keys are secrets set in the dashboard. No-op
      # until both keys are present. Set LANGFUSE_HOST if not on the EU cloud.
      - key: LANGFUSE_ENABLED
        value: "true"
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcp-sa.json
      # --- secrets / per-deploy values: paste in the Render dashboard ---
      - key: JWT_SECRET                 # openssl rand -hex 32
        sync: false
      - key: DATABASE_URL               # Neon, postgresql+asyncpg://...
        sync: false
      - key: QDRANT_URL                 # https://...cloud.qdrant.io:6333
        sync: false
      - key: SOURCEBOUND_QDRANT_API_KEY
        sync: false
      - key: REDIS_URL                  # Upstash rediss://...
        sync: false
      - key: VERTEX_PROJECT_ID          # your GCP project id
        sync: false
      - key: SOURCEBOUND_CORS_ORIGINS   # set to your Vercel URL after step 4
        sync: false
      - key: TAVILY_API_KEY             # web-search fallback; paste in dashboard
        sync: false
      - key: LANGFUSE_PUBLIC_KEY        # pk-lf-...; paste in dashboard
        sync: false
      - key: LANGFUSE_SECRET_KEY        # sk-lf-...; paste in dashboard
        sync: false
