name: sourcebound

# Full Sourcebound stack — api + worker + frontend + postgres + qdrant + redis +
# langfuse — in one command:
#
#     docker compose up --build -d
#
# App secrets (JWT_SECRET, LLM provider creds, Langfuse keys, Tavily) come from
# backend/.env (env_file below). Infra/compose config comes from the repo-root .env
# (copy from .env.example). The `migrate` job runs Alembic once before api/worker.

services:
  # --- Application metadata store (Postgres) ---
  postgres:
    image: postgres:16-alpine
    container_name: sourcebound-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sourcebound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcebound}
      POSTGRES_DB: ${POSTGRES_DB:-sourcebound}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sourcebound} -d ${POSTGRES_DB:-sourcebound}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Vector store (Qdrant): 6333 HTTP/dashboard, 6334 gRPC ---
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: sourcebound-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # --- Cache / Celery broker (Redis) ---
  redis:
    image: redis:7-alpine
    container_name: sourcebound-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DB migrations (one-shot; api + worker wait for this to finish) ---
  # Reuses the image built by `api` (compose builds all images before starting any
  # container), so there's a single backend artifact.
  migrate:
    image: sourcebound/api:local
    container_name: sourcebound-migrate
    command: alembic upgrade head
    restart: "no"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sourcebound}:${POSTGRES_PASSWORD:-sourcebound}@postgres:5432/${POSTGRES_DB:-sourcebound}
    depends_on:
      postgres:
        condition: service_healthy

  # --- API (FastAPI / uvicorn) — builds the single backend image ---
  api:
    image: sourcebound/api:local
    build:
      context: ./backend
    container_name: sourcebound-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: ./backend/.env
    environment:
      # Container-network service URLs override anything in backend/.env.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sourcebound}:${POSTGRES_PASSWORD:-sourcebound}@postgres:5432/${POSTGRES_DB:-sourcebound}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      SOURCEBOUND_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # Vertex AI auth: mounts your local gcloud ADC so the container can call Gemini.
      # Harmless if absent (an empty dir is mounted); only needed when LLM_PROVIDER=vertex.
      # Switch to an API-key provider (groq/gemini) to drop this dependency.
      - ${HOME}/.config/gcloud:/home/appuser/.config/gcloud:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # --- Celery worker (async ingestion) — reuses the api image ---
  worker:
    image: sourcebound/api:local
    container_name: sourcebound-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    # The shared image's HTTP /health check is for the API; a Celery worker has no
    # HTTP server, so probe the worker via the broker instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -t 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sourcebound}:${POSTGRES_PASSWORD:-sourcebound}@postgres:5432/${POSTGRES_DB:-sourcebound}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ${HOME}/.config/gcloud:/home/appuser/.config/gcloud:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # --- Frontend (Next.js, standalone production server) ---
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is baked at build time and runs in the browser, so it must
        # point at the host-published API port, not the internal `api` hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_ENV: ${NEXT_PUBLIC_ENV:-production}
    container_name: sourcebound-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- Langfuse's own Postgres (kept separate from app data) ---
  langfuse-db:
    image: postgres:16-alpine
    container_name: sourcebound-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Observability (Langfuse v2 UI/API) — host 3001 to avoid clashing with Next.js:3000 ---
  langfuse:
    image: langfuse/langfuse:2
    container_name: sourcebound-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-nextauth-secret}
      SALT: ${LANGFUSE_SALT:-change-me-salt}
      TELEMETRY_ENABLED: ${LANGFUSE_TELEMETRY_ENABLED:-false}

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  langfuse-db-data:
